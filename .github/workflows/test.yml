name: Go Tests

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Format, build, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: willcoll
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: willcoll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U willcoll -d willcoll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATE_DSN: postgres://willcoll:ci-owner-password@localhost:5432/willcoll?sslmode=disable
      DB_DSN: postgres://willcoll_app:ci-app-password@localhost:5432/willcoll?sslmode=disable
      DB_ADMIN_PASSWORD: ci-admin-password
      DB_APP_PASSWORD: ci-app-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -vet=off ./...

      - name: Install PostgreSQL migration tool
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Create database roles
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$MIGRATE_DSN" \
            -v app_password="$DB_APP_PASSWORD" \
            -v admin_password="$DB_ADMIN_PASSWORD" \
            -f scripts/db_roles.sql

      - name: Integration tests
        run: sh scripts/test_integration.sh
